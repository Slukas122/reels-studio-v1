<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<script src="motion.js"></script>
<body><script>
/* 02b · LAUNCH REEL – SVETLÝ SaaS VARIANT  ·  16:9  ·  14 s  ·  116 BPM
   Svetlé plátno, obrie čísla vľavo, reálne screenshoty vpravo v "3D" (perspektíva cez skew + scaleX),
   ghost motion blur pri rýchlych príletoch, mono popisky v rohoch, kapitoly 01 / 02 / 03. */
const W = 1920, H = 1080, DUR = 14;
const BG = '#F3F3F1', INK = '#121316', GRAY = '#7B7F8A', ACC = '#FF6B35', OK = '#22A06B';
const F = 'Space Grotesk', MONO = 'JetBrains Mono', NUM = 'Inter';
const CHAP = [[0, 'INTRO'], [2.4, '01 / SKILLY'], [6.4, '02 / YOUTUBE'], [10.2, '03 / WEB']];

// "3D" karta: rotY v radiánoch → scaleX = cos, skewY = sin * k (lacná, ale presvedčivá perspektíva)
function card3d(g, img, cx, cy, w, h, rotY, o = {}) {
  g.save(); g.translate(cx, cy);
  g.transform(Math.cos(rotY), Math.sin(rotY) * 0.18, 0, 1, 0, 0);
  if (o.scale) g.scale(o.scale, o.scale);
  g.globalAlpha *= o.alpha ?? 1;
  g.shadowColor = 'rgba(20,20,30,.22)'; g.shadowBlur = 50; g.shadowOffsetY = 26;
  g.fillStyle = '#15171d'; M.rrect(g, -w / 2, -h / 2, w, h, 22); g.fill(); g.shadowColor = 'transparent';
  M.image(g, img, -w / 2, -h / 2, w, h, { r: 22 });
  if (o.dim) { g.fillStyle = `rgba(243,243,241,${o.dim})`; M.rrect(g, -w / 2, -h / 2, w, h, 22); g.fill(); }
  g.restore();
}
// ghost motion blur: nakresli stav v niekoľkých minulých časoch so slabnúcou alfou
function ghost(g, t, fn, n = 5, dt = 0.012) { for (let k = n; k >= 1; k--) { g.save(); g.globalAlpha = 0.12 * (1 - k / (n + 1)); fn(t - k * dt); g.restore(); } fn(t); }

M.film({
  W, H, DUR, BG, title: 'launch-reel-svetly',
  fonts: [`700 100px "${F}"`, `800 100px ${NUM}`, `500 20px "${MONO}"`],
  images: { s1: 'assets/skill1.png', s2: 'assets/skill2.png', s3: 'assets/skill3.png', s4: 'assets/skill4.png', s5: 'assets/skill5.png',
    t1: 'assets/yt/t1.jpg', t2: 'assets/yt/t2.jpg', t3: 'assets/yt/t3.jpg', t4: 'assets/yt/t4.jpg', t5: 'assets/yt/t5.jpg', home: 'assets/home-full.png' },
  music: { bpm: 112, style: 'corporate', key: 'G' },
  cues: [
    { t: 0.1, type: 'thump' }, { t: 0.7, type: 'pop', gain: .5 }, { t: 2.4, type: 'whoosh' },
    ...[0, 1, 2, 3, 4].map(i => ({ t: 2.9 + i * 0.35, type: 'swoosh', gain: .55 })), ...[0, 1, 2, 3, 4].map(i => ({ t: 2.7 + i * 0.3, type: 'tick' })),
    { t: 6.4, type: 'whoosh' }, ...Array.from({ length: 10 }, (_, i) => ({ t: 6.6 + i * 0.08, type: 'tick', gain: .6 })), { t: 8.3, type: 'pop' }, { t: 8.35, type: 'ding' },
    { t: 10.2, type: 'whoosh' }, { t: 11.9, type: 'click' }, { t: 12.6, type: 'impact' },
  ],
  before(g, T) { const v = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .7); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.07)'); g.fillStyle = v; g.fillRect(0, 0, W, H); },
  scenes: [
    /* INTRO – lockup značky */
    { from: 0, to: 2.4, draw(g, t) {
      const a = M.sp(t - 0.1, 'heavy'), out = M.prog(t, 2.0, 0.35, M.ease.in);
      const fnt = `700 170px "${F}"`, w1 = M.measure(g, 'example', fnt, -8), w2 = M.measure(g, 'ai', fnt, -8), dot = 44, tot = w1 + dot + w2;
      g.save(); g.globalAlpha = 1 - out; g.translate(W / 2, H / 2 - 60 - out * 40); g.scale(0.9 + 0.1 * a, 0.9 + 0.1 * a);
      M.text(g, 'example', -tot / 2, 0, { font: fnt, color: INK, spacing: -8, align: 'left', alpha: M.clamp(a * 2) });
      const d = M.sp(t - 0.6, 'playful'); g.fillStyle = ACC; g.beginPath(); g.arc(-tot / 2 + w1 + dot / 2, 48, 20 * d, 0, M.TAU); g.fill();
      M.text(g, 'ai', -tot / 2 + w1 + dot, 0, { font: fnt, color: ACC, spacing: -8, align: 'left', alpha: M.clamp((t - 0.6) * 4) });
      g.restore();
      const l = M.sp(t - 0.9, 'base');
      M.text(g, 'tvoj AI sprievodca', W / 2 - 170, 660 + (1 - l) * 30, { font: `500 58px "${F}"`, color: GRAY, alpha: M.clamp((t - 0.9) * 4) * (1 - out) });
      M.text(g, 'po slovensky.', W / 2 + 280, 660 + (1 - l) * 30, { font: `600 58px "${F}"`, color: ACC, alpha: M.clamp((t - 1.1) * 4) * (1 - out) });
    }},

    /* 01 · SKILLY – obrie číslo vľavo, 3D balíček reálnych kariet vpravo */
    { from: 2.4, to: 6.4, draw(g, t) {
      M.text(g, 'LEAD MAGNET', 180, 250, { font: `600 26px "${MONO}"`, color: ACC, align: 'left', spacing: 6, alpha: M.prog(t, 0.1, 0.3) });
      const n = Math.min(5, 1 + Math.floor(M.clamp((t - 0.3) / 1.5) * 5));
      g.save(); g.translate(180, 470); const ps = 1 + 0.08 * (1 - M.sp(t - 0.3 - (n - 1) * 0.3, 'snappy'));
      g.scale(ps, ps); M.text(g, String(n), 0, 0, { font: `800 380px ${NUM}`, color: INK, align: 'left', spacing: -20 }); g.restore();
      M.text(g, 'skillov zadarmo', 180, 720, { font: `700 104px "${F}"`, color: INK, align: 'left', spacing: -4, alpha: M.prog(t, 0.4, 0.3) });
      M.text(g, 'pre Claude aj ChatGPT,', 180, 815, { font: `500 50px "${F}"`, color: GRAY, align: 'left', alpha: M.prog(t, 0.7, 0.3) });
      M.text(g, 'po slovensky.', 740, 815, { font: `600 50px "${F}"`, color: ACC, align: 'left', alpha: M.prog(t, 0.85, 0.3) });
      // karty prilietajú jedna za druhou, predošlé ustupujú dozadu
      const keys = ['s1', 's2', 's3', 's4', 's5'];
      keys.forEach((k, i) => { const at = 0.5 + i * 0.35, img = IMG[k], cw = 720, ch = img.height * cw / img.width;
        const draw = (tt) => { const p = M.sp(tt - at, 'base'); if (p <= 0.001) return;
          const depth = keys.filter((_, j) => j > i && t > 0.5 + j * 0.35).length;
          const back = depth ? M.sp(t - (0.5 + (i + depth) * 0.35), 'base') * 0 + 1 : 0;
          const x = 1370 + (1 - p) * 900 - depth * 34, y = 560 - depth * 40;
          card3d(g, img, x, y, cw, ch, -0.42 + (1 - p) * -0.5, { scale: 1 - 0.04 * depth, dim: 0.07 * depth }); };
        if (t - at < 0.35 && t - at > 0) ghost(g, t, draw); else draw(t); });
    }},

    /* 02 · YOUTUBE – počítadlo odberateľov + vejár thumbnailov + odznak */
    { from: 6.4, to: 10.2, draw(g, t, T) {
      M.text(g, 'YOUTUBE', 180, 250, { font: `600 26px "${MONO}"`, color: ACC, align: 'left', spacing: 6, alpha: M.prog(t, 0.1, 0.3) });
      const v = Math.round(35000 * M.prog(t, 0.2, 0.9, M.ease.expoOut));
      M.text(g, v.toLocaleString('sk-SK'), 170, 420, { font: `800 230px ${NUM}`, color: INK, align: 'left', spacing: -12 });
      M.text(g, 'odberateľov.', 180, 590, { font: `700 96px "${F}"`, color: INK, align: 'left', spacing: -3, alpha: M.prog(t, 0.5, 0.3) });
      M.text(g, '5 videí týždenne.', 180, 690, { font: `500 50px "${F}"`, color: GRAY, align: 'left', alpha: M.prog(t, 0.8, 0.3) });
      M.text(g, 'AI a financie.', 615, 690, { font: `600 50px "${F}"`, color: ACC, align: 'left', alpha: M.prog(t, 0.95, 0.3) });
      // vejár: 5 thumbnailov sa rozloží do oblúka, pomaly rotuje
      const fan = M.sp(t - 0.5, 'base'), rot = (t - 0.5) * 0.05;
      ['t1', 't2', 't3', 't4', 't5'].forEach((k, i) => { const j = i - 2, a = (j * 0.13 + rot) * fan;
        g.save(); g.translate(1560 + j * 50 * fan, 1250); g.rotate(a); g.translate(0, -700 + (1 - M.sp(t - 0.3 - i * 0.08, 'base')) * 700);
        g.shadowColor = 'rgba(20,20,30,.25)'; g.shadowBlur = 40; g.shadowOffsetY = 20; g.fillStyle = '#000'; M.rrect(g, -260, -146, 520, 292, 18); g.fill();
        g.shadowColor = 'transparent'; M.image(g, IMG[k], -260, -146, 520, 292, { r: 18 }); g.restore(); });
      // odznak "Nové video" s krúžkom
      const b = M.sp(t - 1.9, 'playful');
      if (b > 0.01) { g.save(); g.translate(1640, 330); g.rotate(-0.18); g.scale(b, b);
        g.strokeStyle = M.alpha(OK, 0.35 * (1 - M.prog(t, 1.9, 0.8))); g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 90 + 120 * M.prog(t, 1.9, 0.8), 0, M.TAU); g.stroke();
        g.fillStyle = OK; M.rrect(g, -150, -38, 300, 76, 38); g.fill();
        M.text(g, '✓ Nové video', 0, 2, { font: `700 36px "${F}"`, color: '#fff' }); g.restore(); }
    }},

    /* 03 · WEB – okno prehliadača, stránka sa scrolluje, kurzor, záverečný lockup */
    { from: 10.2, to: 14, draw(g, t) {
      const inP = M.sp(t, 'base'), ww = 1240, wh = 760, x = W / 2 - ww / 2 + 180, y = 190 + (1 - inP) * 700;
      const end = M.sp(t - 2.3, 'base');
      g.save(); g.translate(x + ww / 2, y + wh / 2); g.scale(1 - 0.12 * end, 1 - 0.12 * end); g.translate(-(x + ww / 2), -(y + wh / 2));
      g.globalAlpha = 1 - 0.93 * end;
      g.shadowColor = 'rgba(20,20,30,.25)'; g.shadowBlur = 70; g.shadowOffsetY = 30; g.fillStyle = '#fff'; M.rrect(g, x, y, ww, wh, 20); g.fill(); g.shadowColor = 'transparent';
      ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(x + 30 + i * 26, y + 28, 8, 0, M.TAU); g.fill(); });
      g.fillStyle = '#EEEEEC'; M.rrect(g, x + 380, y + 12, 480, 32, 16); g.fill();
      M.text(g, 'example.com', x + 620, y + 29, { font: `500 18px "${MONO}"`, color: GRAY });
      const img = IMG.home, sc = ww / img.width, scroll = M.prog(t, 0.6, 1.6, M.ease.inOut) * 640;
      g.save(); M.rrect(g, x, y + 56, ww, wh - 56, 0); g.clip(); g.drawImage(img, x, y + 56 - scroll, ww, img.height * sc); g.restore();
      g.restore();
      // text vľavo
      M.text(g, 'WEB', 180, 250, { font: `600 26px "${MONO}"`, color: ACC, align: 'left', spacing: 6, alpha: M.prog(t, 0.1, 0.3) * (1 - end) });
      // lockup
      if (end > 0.01) { g.save(); g.translate(W / 2, H / 2 - 20); g.scale(0.92 + 0.08 * end, 0.92 + 0.08 * end); g.globalAlpha = end;
        M.text(g, 'example.com', 0, 0, { font: `700 180px "${F}"`, color: INK, spacing: -8 });
        M.text(g, 'Pridaj sa →', 0, 150, { font: `600 56px "${F}"`, color: ACC }); g.restore(); }
    }},
  ],
  after(g, T) { // mono popisky a rohové značky (zámerný HUD, nie "slop": každá nesie informáciu)
    const m = 70; g.strokeStyle = M.alpha(INK, .35); g.lineWidth = 2;
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, dx, dy]) => { g.beginPath(); g.moveTo(x + dx * 22, y); g.lineTo(x, y); g.lineTo(x, y + dy * 22); g.stroke(); });
    let c = CHAP[0][1]; for (const [tt, s] of CHAP) if (T >= tt) c = s;
    M.text(g, 'EXAMPLE.COM', m + 20, m + 26, { font: `500 20px "${MONO}"`, color: GRAY, align: 'left', spacing: 3 });
    M.text(g, c, W - m - 20, m + 26, { font: `500 20px "${MONO}"`, color: GRAY, align: 'right', spacing: 3 });
    const f = Math.floor(T * 30); M.text(g, `00:00:${String(Math.floor(T)).padStart(2, '0')}:${String(f % 30).padStart(2, '0')}`, m + 20, H - m - 22, { font: `500 20px "${MONO}"`, color: GRAY, align: 'left', spacing: 3 });
    M.text(g, 'EXAMPLE.COM', W - m - 20, H - m - 22, { font: `500 20px "${MONO}"`, color: GRAY, align: 'right', spacing: 3 });
  },
});
</script>
