<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<script src="motion.js"></script>
<body><script>
/* 09 · RETRO NEON REEL  ·  16:9  ·  12 s  ·  110 BPM
   Synthwave: hlboká fialová, neónové obrysy (trim paths), pixelové písmo, slnko nad perspektívnou mriežkou,
   kamerový HUD (REC, timecode, kapitoly). Obsah: DEMO plochy; nahraďte vlastnými thumbnailmi. */
const W = 1920, H = 1080, DUR = 12;
const BG = '#150734', PURP = '#2A0E6B', CYAN = '#22E5FF', PINK = '#FF2EA6', ORNG = '#FF9A3C', YEL = '#FFE45C', WHITE = '#F7F2FF';
const MONO = 'JetBrains Mono';
const B = M.beats(110);
const TH = ['t1', 't2', 't3', 't4', 't5', 't6'];
const CHAP = [[0, '01 HOOK / PIXEL TYPE'], [2.4, '02 STACK / TRIM PATHS'], [6, '03 GRID / SCAN'], [9, '04 OUTRO / NEON SIGN']];

// ---------- pixelové písmo: text do malého plátna, zväčšiť bez vyhladenia (deterministická cache) ----------
const pxCache = {};
function pixelText(g, str, x, y, size, color, px = 8) {
  const key = str + size + color + px;
  if (!pxCache[key]) { const c = document.createElement('canvas'), p = c.getContext('2d'), s = Math.round(size / px);
    p.font = `800 ${s}px "${MONO}"`; const w = Math.ceil(p.measureText(str).width) + 4; c.width = w; c.height = Math.ceil(s * 1.4);
    p.font = `800 ${s}px "${MONO}"`; p.fillStyle = color; p.textBaseline = 'middle'; p.fillText(str, 2, c.height / 2); pxCache[key] = c; }
  const c = pxCache[key]; g.save(); g.imageSmoothingEnabled = false; g.drawImage(c, x - c.width * px / 2, y - c.height * px / 2, c.width * px, c.height * px); g.restore();
  return c.width * px;
}
// neónový obrys, ktorý sa "nakreslí" (trim path)
function neonRect(g, x, y, w, h, r, color, p, lw = 10) {
  if (p <= 0) return; const per = 2 * (w + h);
  g.save(); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.shadowColor = color; g.shadowBlur = 28;
  g.setLineDash([per * p, per]); M.rrect(g, x, y, w, h, r); g.stroke();
  g.shadowBlur = 0; g.lineWidth = lw * 0.35; g.strokeStyle = '#fff'; g.globalAlpha = 0.7; g.stroke(); g.restore();
}
function sparkle(g, x, y, s) { if (s <= 0) return; g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = '#fff'; g.shadowColor = '#fff'; g.shadowBlur = 20;
  g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? 10 : 46; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fill(); g.restore(); }
function stars(g, T, a = 1) { for (let i = 0; i < 70; i++) { const tw = 0.5 + 0.5 * Math.sin(T * (2 + M.hash(i, 5) * 4) + i);
  g.fillStyle = [WHITE, PINK, CYAN][i % 3]; g.globalAlpha = a * 0.25 * tw; const s = 3 + M.hash(i, 9) * 6; g.fillRect(M.hash(i, 1) * W, M.hash(i, 2) * H, s, s); } g.globalAlpha = 1; }
function sun(g, x, y, r, T) {
  g.save(); const gr = g.createLinearGradient(0, y - r, 0, y + r); gr.addColorStop(0, YEL); gr.addColorStop(0.55, ORNG); gr.addColorStop(1, PINK);
  g.shadowColor = PINK; g.shadowBlur = 60; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, M.TAU); g.fill(); g.shadowBlur = 0;
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 7; i++) { const yy = y + r * 0.1 + i * r * 0.14 + ((T * 30) % (r * 0.14)); g.fillRect(x - r, yy, 2 * r, 4 + i * 2.2); }
  g.restore();
}
function floor(g, T, horizon) {
  g.save(); g.strokeStyle = PINK; g.lineWidth = 2.5; g.shadowColor = PINK; g.shadowBlur = 12;
  for (let i = -14; i <= 14; i++) { g.beginPath(); g.moveTo(W / 2 + i * 30, horizon); g.lineTo(W / 2 + i * 260, H); g.stroke(); }
  for (let k = 0; k < 12; k++) { const z = ((k + (T * 1.6) % 1) / 12), y = horizon + Math.pow(z, 2.2) * (H - horizon);
    g.globalAlpha = 0.3 + 0.7 * z; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
}

M.film({
  W, H, DUR, BG, title: 'retro-neon',
  fonts: [`800 60px "${MONO}"`, `500 30px "${MONO}"`],
  images: Object.fromEntries(TH.map(k => [k, `assets/yt/${k}.jpg`])),
  music: { bpm: 110, style: 'synthwave', key: 'A' },
  cues: [
    ...[...'UKÁZKA.'].map((_, i) => ({ t: 0.15 + i * 0.2, type: 'blip', gain: .8 })), { t: 1.9, type: 'impact' },
    { t: 2.4, type: 'whoosh' }, ...[0, 1, 2, 3].map(i => ({ t: 2.55 + i * 0.18, type: 'swoosh', gain: .5 })), { t: 3.5, type: 'ding' },
    ...[0, 1, 2].map(i => ({ t: 4.0 + i * B.spb * 2, type: 'click' })),
    { t: 6.0, type: 'whoosh' }, ...[0, 1, 2, 3, 4, 5].map(i => ({ t: 6.3 + i * 0.12, type: 'pop', gain: .5 })), { t: 7.6, type: 'swoosh', gain: .5 },
    { t: 9.0, type: 'riser', gain: .6 }, { t: 9.4, type: 'blip' }, { t: 9.55, type: 'blip' }, { t: 9.8, type: 'impact' },
    ...Array.from({ length: 8 }, (_, i) => ({ t: 10.1 + i * 0.09, type: 'tick', gain: .6 })),
  ],
  before(g, T) { const gr = g.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, W * 0.7); gr.addColorStop(0, PURP); gr.addColorStop(1, BG); g.fillStyle = gr; g.fillRect(0, 0, W, H); stars(g, T); },
  scenes: [
    /* 1 · HOOK – ružové pozadie, pixelový text sa píše po 8-inách, RGB glitch */
    { from: 0, to: 2.4, draw(g, t) {
      g.fillStyle = PINK; g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(0,0,0,.06)'; for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 2); // scanlines
      const str = 'UKÁZKA.', n = Math.min(str.length, Math.floor((t - 0.15) / 0.2) + 1);
      const gl = t > 1.9 && t < 2.2 ? 1 : 0, off = gl * (M.hash(Math.floor(t * 30), 3) - .5) * 40;
      if (gl) { pixelText(g, str.slice(0, n), W / 2 + off - 10, H / 2 + 60, 300, CYAN); }
      pixelText(g, str.slice(0, n), W / 2 + off, H / 2 + 60, 300, '#2A0B4F');
      // horný meter: frame číslo + "zvuk"
      M.text(g, `F ${String(Math.floor(t * 30) + 60).padStart(3, '0')}`, 140, 190, { font: `600 64px "${MONO}"`, color: WHITE, align: 'left' });
      for (let i = 0; i < 26; i++) { const hgt = 8 + 44 * Math.abs(M.noise(t * 6 + i * .7, 2)); g.fillStyle = WHITE; g.fillRect(1400 + i * 14, 205 - hgt, 8, hgt); }
      g.strokeStyle = WHITE; g.lineWidth = 2; g.beginPath(); g.moveTo(420, 190); g.lineTo(1360, 190); g.stroke();
      for (let i = 0; i < 20; i++) g.fillRect(420 + i * 47, 180, 2, i % 5 ? 10 : 20);
      g.fillStyle = YEL; g.fillRect(420 + (t / 2.4) * 940 - 3, 165, 6, 50);
    }},

    /* 2 · STACK – neónové obrysy sa nakreslia, predná karta prepína thumbnaily na beat */
    { from: 2.4, to: 6, draw(g, t, T) {
      const cols = [ORNG, PINK, CYAN, WHITE], cw = 880, ch = 495, r = 56;
      cols.forEach((c, i) => { const p = M.prog(t, i * 0.18, 0.6, M.ease.inOut), s = M.sp(t - i * 0.18, 'base');
        const x = 330 + i * 110, y = 200 + i * 70;
        g.save(); g.translate(x + cw / 2, y + ch / 2); g.scale(0.9 + 0.1 * s, 0.9 + 0.1 * s); g.translate(-(x + cw / 2), -(y + ch / 2));
        if (i === 3) { const k = Math.min(TH.length - 1, Math.max(0, Math.floor((t - 1.0) / (B.spb * 2)))), img = IMG[TH[k]];
          g.globalAlpha = M.prog(t, 0.8, 0.4); g.save(); M.rrect(g, x, y, cw, ch, r); g.clip();
          const sc = ch / img.height; g.drawImage(img, x + cw / 2 - img.width * sc / 2, y, img.width * sc, ch); g.restore(); g.globalAlpha = 1; }
        neonRect(g, x, y, cw, ch, r, c, p, i === 3 ? 12 : 10); g.restore(); });
      sparkle(g, 1640, 400, M.sp(t - 1.1, 'playful') * (0.9 + 0.15 * Math.sin(T * 8)));
    }},

    /* 3 · GRID – slnko, mriežka, 3×2 thumbnaily so skenovacím zvýraznením */
    { from: 6, to: 9, draw(g, t, T) {
      sun(g, W / 2, 700, 260, T); floor(g, T, 700);
      g.fillStyle = 'rgba(21,7,52,.35)'; g.fillRect(0, 0, W, 700);
      const tw = 440, th = 248, gap = 40, x0 = W / 2 - (3 * tw + 2 * gap) / 2, y0 = 180;
      const scan = M.track(t, [[0, -1], [0.9, 0], [1.3, 1], [1.7, 2], [2.1, 3], [2.5, 4], [2.9, 5]], 'snappy');
      TH.forEach((k, i) => { const cx = i % 3, cy = Math.floor(i / 3), s = M.sp(t - 0.25 - i * 0.12, 'playful');
        const x = x0 + cx * (tw + gap), y = y0 + cy * (th + gap), hot = Math.max(0, 1 - Math.abs(scan - i));
        g.save(); g.translate(x + tw / 2, y + th / 2 - hot * 14); g.scale(s * (1 + hot * 0.06), s * (1 + hot * 0.06));
        g.save(); M.rrect(g, -tw / 2, -th / 2, tw, th, 22); g.clip(); g.drawImage(IMG[k], -tw / 2, -th / 2, tw, th);
        g.fillStyle = `rgba(42,14,107,${0.45 * (1 - hot)})`; g.fillRect(-tw / 2, -th / 2, tw, th); g.restore();
        neonRect(g, -tw / 2, -th / 2, tw, th, 22, [CYAN, PINK, ORNG][i % 3], 1, hot > .5 ? 8 : 5); g.restore(); });
    }},

    /* 4 · OUTRO – neónový nápis zabliká a chytí, pixelové počítadlo */
    { from: 9, to: 12, draw(g, t, T) {
      sun(g, W / 2, 800 + M.prog(t, 0, 3, M.ease.inOut) * 120, 260, T); floor(g, T, 800);
      g.fillStyle = 'rgba(21,7,52,.25)'; g.fillRect(0, 0, W, 800);
      const on = t < 0.8 ? (M.hash(Math.floor(t * 20), 4) > 0.45 ? 1 : 0.15) : 1;
      g.save(); g.globalAlpha = M.prog(t, 0.3, 0.1) * on; g.font = `800 150px "${MONO}"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '4px';
      g.lineWidth = 6; g.strokeStyle = PINK; g.shadowColor = PINK; g.shadowBlur = 40; g.strokeText('VAŠE ZNAČKA', W / 2, 300);
      g.shadowBlur = 0; g.lineWidth = 2; g.strokeStyle = '#FFE3F4'; g.strokeText('VAŠE ZNAČKA', W / 2, 300); g.restore();
      const v = Math.round(35000 * M.prog(t, 1.05, 0.9, M.ease.expoOut));
      if (t > 1.0) pixelText(g, v.toLocaleString('sk-SK').replace(/\s/g, ' ') + ' ODBERATEĽOV', W / 2, 460, 80, CYAN, 5);
    }},
  ],
  after(g, T) { // kamerový HUD cez všetko
    const pink = T < 2.4, col = pink ? WHITE : WHITE;
    g.strokeStyle = col; g.lineWidth = 3; const m = 60, a = 40;
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, dx, dy]) => { g.beginPath(); g.moveTo(x + dx * a, y); g.lineTo(x, y); g.lineTo(x, y + dy * a); g.stroke(); });
    M.text(g, 'UKÁZKA / REEL 26', m + 20, m + 30, { font: `500 30px "${MONO}"`, color: col, align: 'left', spacing: 1 });
    if (Math.floor(T * 2) % 2 === 0) { g.fillStyle = pink ? WHITE : PINK; g.beginPath(); g.arc(W - m - 120, m + 30, 9, 0, M.TAU); g.fill(); }
    M.text(g, 'REC', W - m - 20, m + 30, { font: `500 30px "${MONO}"`, color: col, align: 'right' });
    M.text(g, `${String(Math.floor(T / 60)).padStart(2, '0')}:${String(Math.floor(T) % 60).padStart(2, '0')}`, m + 20, H - m - 30, { font: `500 30px "${MONO}"`, color: col, align: 'left' });
    let c = CHAP[0][1]; for (const [tt, s] of CHAP) if (T >= tt) c = s;
    M.text(g, c, W - m - 20, H - m - 30, { font: `500 30px "${MONO}"`, color: col, align: 'right', spacing: 1 });
    M.grain(g, W, H, T, 0.05);
  },
});
</script>
